name: Disk Probe (X6840)

on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe runner disk
    runs-on: ubuntu-24.04
    steps:
      - name: Show disk layout
        run: |
          echo "===== df -h ====="
          df -h
          echo ""
          echo "===== df -h (inodes) ====="
          df -ih
          echo ""
          echo "===== lsblk ====="
          lsblk -o NAME,SIZE,TYPE,MOUNTPOINT,FSTYPE
          echo ""
          echo "===== mount | grep -E 'mnt|home|work' ====="
          mount | grep -E 'mnt|home|work' || true
          echo ""
          echo "===== GITHUB_WORKSPACE ====="
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          echo "HOME=$HOME"
          echo ""
          echo "===== space around candidate dirs ====="
          for d in / /mnt /mnt/scratch /home /home/runner "$GITHUB_WORKSPACE" /tmp /var/tmp; do
            if [ -d "$d" ]; then
              printf "%-30s " "$d"
              df -h --output=avail "$d" 2>/dev/null | tail -1
            fi
          done
          echo ""
          echo "===== biggest dirs on / ====="
          sudo du -xh -d1 / 2>/dev/null | sort -rh | head -20
