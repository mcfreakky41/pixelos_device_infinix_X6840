name: Build PixelOS for Infinix Smart 20 (X6840)

on:
  workflow_dispatch:
    inputs:
      pixelos_branch:
        description: "PixelOS branch"
        required: true
        default: "sixteen"
      build_type:
        description: "Build type"
        required: true
        default: "userdebug"
        type: choice
        options: [userdebug, user, eng]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ROM
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 480

    steps:
      - name: Free disk space (native)
        run: |
          set +e
          echo "=== Disk sebelum ==="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo rm -rf /usr/share/swift /usr/local/go 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          # Enable 4G swap
          sudo fallocate -l 4G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 2>/dev/null
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile 2>/dev/null || true
          sudo swapon /swapfile 2>/dev/null || true
          echo "=== Disk sesudah ==="; df -h /
          echo "=== Inodes ==="; df -ih /

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device-tree
          fetch-depth: 0

      - name: Set up build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential ccache curl flex \
            git gnupg gperf imagemagick libelf-dev liblz4-tool libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 openjdk-21-jdk

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config --global user.name "PixelOS Builder"
          git config --global user.email "builder@localhost"

      - name: Initialize PixelOS source
        run: |
          mkdir -p ~/android/pixelos
          cd ~/android/pixelos
          git config --global color.ui false
          repo init --depth=1 --partial-clone --clone-filter=blob:limit=10M --no-repo-verify \
            -u https://github.com/PixelOS-AOSP/manifest.git \
            -b "${{ github.event.inputs.pixelos_branch || 'sixteen' }}"

      - name: Sync sources
        run: |
          cd ~/android/pixelos
          echo "=== SYNC $(date -u) ==="
          repo sync -c -j$(nproc --all) --force-sync \
            --no-clone-bundle --no-tags --optimized-fetch || {
            echo "SYNC FAILED, retrying..."; sleep 30;
            repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags;
          }
          echo "=== SYNC SELESAI: $(date -u) ==="

      - name: Reclaim space
        run: |
          cd ~/android/pixelos
          echo "=== Disk sebelum ==="; df -h /
          find . -type d -name .git -prune -exec rm -rf {} + 2>/dev/null || true
          rm -rf .repo 2>/dev/null || true
          echo "=== Disk sesudah ==="; df -h /

      - name: Setup Go toolchain
        run: |
          cd ~/android/pixelos
          GOROOT_DIR="prebuilts/go/linux-arm64"
          mkdir -p prebuilts/go
          if [ ! -x "$GOROOT_DIR/bin/go" ]; then
            GOVER="go1.23.4"
            curl -fL --retry 3 -o /tmp/go.tar.gz "https://go.dev/dl/${GOVER}.linux-arm64.tar.gz"
            rm -rf /tmp/goextract && mkdir -p /tmp/goextract
            tar -C /tmp/goextract -xzf /tmp/go.tar.gz -C /tmp/goextract
            mv /tmp/goextract/go "$GOROOT_DIR"
            rm -f /tmp/go.tar.gz
          fi
          export GOROOT="$(cd "$GOROOT_DIR" && pwd)"
          export PATH="$GOROOT/bin:$PATH"
          unset GOPATH GOFLAGS
          echo ">>> go version:"; go version

      - name: Setup Rust toolchain
        run: |
          cd ~/android/pixelos
          RV="1.83.0"
          TRIPLE="aarch64-unknown-linux-gnu"
          D="prebuilts/rust/linux-arm64/$RV"
          if [ ! -x "$D/bin/rustc" ]; then
            echo ">>> download rust $RV ($TRIPLE)"
            rm -rf /tmp/rustdrop /tmp/ruststage
            mkdir -p /tmp/rustdrop /tmp/ruststage
            curl -fL --retry 3 -o /tmp/rustdrop/rust.tar.gz "https://static.rust-lang.org/dist/rust-${RV}-${TRIPLE}.tar.gz"
            tar xzf /tmp/rustdrop/rust.tar.gz -C /tmp/rustdrop
            SRC="/tmp/rustdrop/rust-${RV}-${TRIPLE}"
            WANT="rustc cargo rust-std-${TRIPLE}"
            COMPONENTS=""
            for c in $WANT; do
              if grep -qx "$c" "$SRC/components"; then
                COMPONENTS="${COMPONENTS:+$COMPONENTS,}$c"
              fi
            done
            ( cd "$SRC" && sh ./install.sh --prefix=/tmp/ruststage --disable-ldconfig --components="$COMPONENTS" )
            mkdir -p "$D"
            cp -a /tmp/ruststage/. "$D/"
            rm -rf /tmp/rustdrop /tmp/ruststage
          fi
          echo ">>> rustc:"; "$D/bin/rustc" --version

      - name: Setup Clang
        run: |
          cd ~/android/pixelos
          CLANG_DIR="prebuilts/clang/host/linux-arm64"
          if [ ! -x "$CLANG_DIR/clang-r584948b/bin/clang" ]; then
            mkdir -p "$CLANG_DIR"
            git clone --depth=1 --filter=blob:none --sparse \
              -b mirror-goog-main-prebuilts \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-arm64 \
              /tmp/clangarm 2>&1 | tail -3
            cd /tmp/clangarm && git sparse-checkout set clang-r584948b 2>&1 | tail -2
            rm -rf "$CLANG_DIR/clang-r584948b"
            mv /tmp/clangarm/clang-r5848b "$CLANG_DIR/clang-r584948b"
            rm -rf /tmp/clangarm
          fi
          ln -sfn clang-r584948b "$CLANG_DIR/clang-r547379"
          ln -sfn clang-r584948b "$CLANG_DIR/clang-r584948"
          ln -sfn 22 "$CLANG_DIR/clang-r584948b/lib/clang/20"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone device + vendor tree
        run: |
          cd ~/android/pixelos
          rm -rf device/infinix/X6840 vendor/infinix/X6840
          mkdir -p device/infinix vendor/infinix
          cp -r "$GITHUB_WORKSPACE/device-tree/device/infinix/X6840" device/infinix/X6840
          cp -r "$GITHUB_WORKSPACE/device-tree/vendor/infinix/X6840" vendor/infinix/X6840

      - name: Apply ARM64 patches
        run: |
          cd ~/android/pixelos
          bash "$GITHUB_WORKSPACE/device-tree/scripts/apply-arm64-host.sh" "$PWD"

      - name: Fetch vendor blobs
        run: |
          cd ~/android/pixelos
          bash "$GITHUB_WORKSPACE/device-tree/scripts/fetch-blobs.sh" \
            vendor/infinix/X6840/proprietary
          echo "Blobs downloaded: $(find vendor/infinix/X6840/proprietary -type f | wc -l) files"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: pixelos-X6840-${{ github.sha }}
          max-size: 5G

      - name: Build
        continue-on-error: true
        run: |
          cd ~/android/pixelos
          echo "=== Disk: $(df -h / | tail -1) ==="
          export LLVM_PREBUILTS_VERSION=clang-r584948b
          export LLVM_RELEASE_VERSION=22
          export CCACHE_EXEC=$(which ccache)
          export USE_CCACHE=1
          ccache -M 5G
          export JOBS=$(nproc --all)
          echo "=== Build: -j$JOBS ==="
          lunch pixelos_X6840 bp2a ${{ github.event.inputs.build_type || 'userdebug' }}
          [ -n "$TARGET_PRODUCT" ] || { echo "LUNCH FAILED"; exit 1; }
          ( while true; do sleep 300; echo "[heartbeat] $(date -u)"; done ) &
          HB=$!
          mka bacon -j$JOBS 2>&1 | tee build.log | grep -v "Warning:"
          kill $HB 2>/dev/null || true

      - name: Upload ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PixelOS-X6840-${{ github.run_number }}
          path: |
            /home/runner/android/pixelos/out/target/product/X6840/*.zip
            /home/runner/android/pixelos/out/target/product/X6840/*.img
            if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: /home/runner/android/pixelos/build.log
          if-no-files-found: ignore
          retention-days: 7