name: Build PixelOS for Infinix Smart 20 (X6840)

on:
  workflow_dispatch:
    inputs:
      pixelos_branch:
        description: "PixelOS branch"
        required: true
        default: "sixteen"
      build_type:
        description: "Build type"
        required: true
        default: "userdebug"
        type: choice
        options: [userdebug, user, eng]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ROM
    # arm64 runner (repo public => gratis):
    #   - 108 GB free (x64 hanya 86 GB), /usr lebih ramping (23 vs 41 GB)
    #   - device X6840 = arm64-v8a -> build native (cepat), bukan emulasi
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350

    steps:
      # Hasil probe:
      #   x64  : / = 145 GB, free 86 GB
      #   arm64: / = 145 GB, free 108 GB   <-- dipakai
      #   TIDAK ada /mnt terpisah -> easimon/maximize-build-space GAGAL
      #   (aksi itu utk runner lama Azure DS2_v2 yg punya /mnt 14 GB).
      # Solusi: cleanup native + partial-clone + reclaim .git/.repo.
      - name: Free disk space (native)
        run: |
          echo "=== Disk sebelum ==="; df -h /
          # Hapus toolchain besar yang tidak dipakai build AOSP
          sudo rm -rf /usr/share/dotnet            || true
          sudo rm -rf /usr/local/lib/android       || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup   || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL  || true
          sudo rm -rf /usr/local/share/boost       || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"      || true
          sudo rm -rf /opt/az /usr/share/miniconda /usr/local/share/powershell || true
          sudo rm -rf /usr/local/go /usr/lib/jvm/*graalvm* || true
          sudo rm -rf /usr/share/swift              || true
          # Bersihkan docker images & apt cache
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean
          # Matikan swap (kalau ada) supaya tidak makan disk
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile /mnt/swapfile 2>/dev/null || true
          echo "=== Disk sesudah ==="; df -h /
          echo "=== Inodes ==="; df -ih /

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Set up build environment
        run: |
          sudo apt-get update -qq
          # Paket inti (tersedia di x64 maupun arm64)
          PKGS="bc bison build-essential ccache curl flex \
            git gnupg gperf imagemagick libelf-dev \
            liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 openjdk-21-jdk"
          # Paket multilib 32-bit HANYA ada di x64. Device X6840 arm64-only
          # (TARGET_SUPPORTS_32_BIT_APPS := false) => tidak diperlukan di arm64.
          if [ "$(uname -m)" = "x86_64" ]; then
            PKGS="$PKGS g++-multilib gcc-multilib lib32readline8 lib32z1"
          fi
          sudo apt-get install -y -qq $PKGS

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config --global user.name "PixelOS Builder"
          git config --global user.email "builder@localhost"
          git config --global credential.helper 'store --file=/tmp/git-creds'
          echo "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com" > /tmp/git-creds

      - name: Initialize PixelOS source
        run: |
          mkdir -p ~/android/pixelos
          cd ~/android/pixelos
          git config --global color.ui false
          # partial-clone: pakai filter 'blob:none' (BUKAN blob:limit).
          # 'blob:limit=10M' mengecualikan blob besar (mis. chromium-webview
          # yang isinya APK >10MB) -> checkout work tree GAGAL:
          #   "Cannot initialize work tree for platform/external/chromium-webview"
          # 'blob:none' menunda semua blob dan mengambilnya on-demand saat
          # checkout -> aman untuk proyek ber-blob besar.
          repo init --depth=1 --partial-clone --clone-filter=blob:none --no-repo-verify \
            -u https://github.com/PixelOS-AOSP/manifest.git \
            -b "${{ github.event.inputs.pixelos_branch || 'sixteen' }}"

      - name: Sync sources
        run: |
          cd ~/android/pixelos
          # Tuned agar tahan throttle & progres terlihat (jangan buffered):
          #  - git http.postBuffer besar, lowSpeedLimit agar tidak menggantung
          #  - repo sync -v (verbose) + unbuffered output via stdbuf
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          git config --global core.compression 0
          echo "=== MULAI SYNC: $(date -u) ==="
          # timeout 90 menit: kalau macet/gantung, gagal cepat (bukan nunggu 350m)
          # retry: error per-proyek (mis. chromium-webview) sering intermiten,
          #        jadi ulangi sync beberapa kali sebelum menyerah.
          ok=0
          for attempt in 1 2 3; do
            echo ">>> SYNC percobaan $attempt/3  ($(date -u))"
            if timeout 5400 stdbuf -oL -eL repo sync -c -j$(nproc --all) \
                 --force-sync --no-clone-bundle --no-tags --optimized-fetch \
                 --verbose 2>&1; then
              echo ">>> SYNC OK pada percobaan $attempt"
              ok=1
              break
            else
              code=$?
              echo ">>> SYNC percobaan $attempt GAGAL (exit=$code) pada $(date -u)"
              if [ "$code" = "124" ]; then echo ">>> TIMEOUT 90 menit: sync macet"; fi
              sleep 15
            fi
          done
          if [ "$ok" != "1" ]; then
            echo "=== SYNC GAGAL setelah 3 percobaan: $(date -u) ==="
            exit 1
          fi
          echo "=== SYNC SELESAI: $(date -u) ==="

      - name: Reclaim space (hapus .git & .repo)
        run: |
          cd ~/android/pixelos
          echo "=== Disk sebelum reclaim ==="; df -h /
          # Build tidak butuh metadata git/.repo. Buang untuk hemat puluhan GB.
          find . -type d -name .git -prune -exec rm -rf {} + 2>/dev/null || true
          rm -rf .repo 2>/dev/null || true
          echo "=== Disk setelah reclaim ==="; df -h /
          echo "=== Ukuran source ==="; du -sh . 2>/dev/null || true

      - name: Clone device + vendor tree
        run: |
          cd ~/android/pixelos
          rm -rf device/infinix/X6840 vendor/infinix/X6840
          mkdir -p device/infinix vendor/infinix
          cp -r "$GITHUB_WORKSPACE/device-tree/device/infinix/X6840" device/infinix/X6840
          cp -r "$GITHUB_WORKSPACE/device-tree/vendor/infinix/X6840" vendor/infinix/X6840

      - name: Fetch vendor blobs (GitHub Release)
        run: |
          cd ~/android/pixelos
          bash "$GITHUB_WORKSPACE/device-tree/scripts/fetch-blobs.sh" \
            vendor/infinix/X6840/proprietary

      - name: Verify blobs
        run: |
          cd ~/android/pixelos
          echo "Jumlah file blob:"; find vendor/infinix/X6840/proprietary -type f | wc -l
          du -sh vendor/infinix/X6840/proprietary

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: pixelos-X6840-${{ github.ref }}
          # Disk runner terbatas; out/ AOSP sendiri bisa 30-40 GB.
          max-size: 2G

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: |
          cd ~/android/pixelos
          echo "=== Disk sebelum build ==="; df -h /
          source build/envsetup.sh
          export CCACHE_EXEC=$(which ccache)
          export USE_CCACHE=1
          export CCACHE_DIR=/home/runner/.ccache
          ccache -M 2G
          # Android 16 butuh RAM besar; batasi job agar runner tidak OOM
          JOBS=$(( $(nproc --all) / 2 ))
          echo "Memakai -j$JOBS  (nproc=$(nproc --all))"
          # PENTING: nama product kita 'pixelos_X6840' mengandung underscore.
          # Format legacy 'product-variant' akan di-parse dgn delimiter '-'
          # sehingga variant jadi kosong -> "Invalid lunch combo".
          # Gunakan format baru: lunch <product> <release> <variant>
          echo "=== LUNCH: $(date -u) ==="
          lunch pixelos_X6840 trunk_staging ${{ github.event.inputs.build_type || 'userdebug' }}
          echo "=== LUNCH SELESAI, cek product ==="
          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"
          echo "TARGET_DEVICE=$TARGET_DEVICE"
          [ -n "$TARGET_PRODUCT" ] || { echo ">>> TARGET_PRODUCT kosong: lunch gagal"; exit 1; }
          # Heartbeat: cetak baris tiap 5 menit supaya log tetap terlihat hidup,
          # dan progres ninja terlihat (unbuffered).
          ( while true; do sleep 300; echo "[heartbeat] $(date -u) build masih jalan"; done ) &
          HB=$!
          echo "=== MULAI mka bacon: $(date -u) ==="
          if ! stdbuf -oL -eL mka bacon -j$JOBS 2>&1 | tee build.log; then
            echo "=== BUILD GAGAL ==="
            tail -300 build.log
            kill $HB 2>/dev/null || true
            exit 1
          fi
          kill $HB 2>/dev/null || true
          echo "=== BUILD SELESAI: $(date -u) ==="
          echo "=== Disk setelah build ==="; df -h /

      - name: Upload ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PixelOS-X6840-${{ github.run_number }}
          path: |
            /home/runner/android/pixelos/out/target/product/X6840/*.zip
            /home/runner/android/pixelos/out/target/product/X6840/*.img
            /home/runner/android/pixelos/out/target/product/X6840/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: /home/runner/android/pixelos/build.log
          if-no-files-found: ignore
          retention-days: 7
