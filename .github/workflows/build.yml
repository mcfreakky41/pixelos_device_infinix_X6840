name: Build PixelOS for Infinix Smart 20 (X6840)

on:
  workflow_dispatch:
    inputs:
      pixelos_branch:
        description: "PixelOS branch"
        required: true
        default: "sixteen"
      build_type:
        description: "Build type"
        required: true
        default: "userdebug"
        type: choice
        options: [userdebug, user, eng]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ROM
    # arm64 runner (repo public => gratis):
    #   - 108 GB free (x64 hanya 86 GB), /usr lebih ramping (23 vs 41 GB)
    #   - device X6840 = arm64-v8a -> build native (cepat), bukan emulasi
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350

    steps:
      # Hasil probe:
      #   x64  : / = 145 GB, free 86 GB
      #   arm64: / = 145 GB, free 108 GB   <-- dipakai
      #   TIDAK ada /mnt terpisah -> easimon/maximize-build-space GAGAL
      #   (aksi itu utk runner lama Azure DS2_v2 yg punya /mnt 14 GB).
      # Solusi: cleanup native + partial-clone + reclaim .git/.repo.
      - name: Free disk space (native)
        run: |
          echo "=== Disk sebelum ==="; df -h /
          # Hapus toolchain besar yang tidak dipakai build AOSP
          sudo rm -rf /usr/share/dotnet            || true
          sudo rm -rf /usr/local/lib/android       || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup   || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL  || true
          sudo rm -rf /usr/local/share/boost       || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"      || true
          sudo rm -rf /opt/az /usr/share/miniconda /usr/local/share/powershell || true
          sudo rm -rf /usr/local/go /usr/lib/jvm/*graalvm* || true
          sudo rm -rf /usr/share/swift              || true
          # Bersihkan docker images & apt cache
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean
          # Matikan swap (kalau ada) supaya tidak makan disk
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile /mnt/swapfile 2>/dev/null || true
          echo "=== Disk sesudah ==="; df -h /
          echo "=== Inodes ==="; df -ih /

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Set up build environment
        run: |
          sudo apt-get update -qq
          # Paket inti (tersedia di x64 maupun arm64)
          PKGS="bc bison build-essential ccache curl flex \
            git gnupg gperf imagemagick libelf-dev \
            liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 openjdk-21-jdk"
          # Paket multilib 32-bit HANYA ada di x64. Device X6840 arm64-only
          # (TARGET_SUPPORTS_32_BIT_APPS := false) => tidak diperlukan di arm64.
          if [ "$(uname -m)" = "x86_64" ]; then
            PKGS="$PKGS g++-multilib gcc-multilib lib32readline8 lib32z1"
          fi
          sudo apt-get install -y -qq $PKGS

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config --global user.name "PixelOS Builder"
          git config --global user.email "builder@localhost"
          git config --global credential.helper 'store --file=/tmp/git-creds'
          echo "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com" > /tmp/git-creds

      - name: Initialize PixelOS source
        run: |
          mkdir -p ~/android/pixelos
          cd ~/android/pixelos
          git config --global color.ui false
          # STRATEGI (terverifikasi dari log):
          #  - Run #9: '--depth=1 --partial-clone --clone-filter=blob:limit=10M'
          #    => "repo sync has finished successfully" (23 menit). Puncak disk
          #    137GB/145GB, jadi --depth=1 WAJIB (tanpa itu tidak muat).
          #    Log run #9 TIDAK punya satu pun error chromium-webview.
          #  - Run #10-#13: error yang sama muncul ~2 menit setelah sync mulai,
          #    DETERMINISTIK. Penyebabnya bukan config init, melainkan
          #    perubahan pada PERINTAH SYNC (lihat step 'Sync sources').
          #  => init tetap seperti run #9.
          repo init --depth=1 --partial-clone --clone-filter=blob:limit=10M --no-repo-verify \
            -u https://github.com/PixelOS-AOSP/manifest.git \
            -b "${{ github.event.inputs.pixelos_branch || 'sixteen' }}"

      - name: Sync sources
        run: |
          cd ~/android/pixelos
          # ============================================================
          # BUKTI (jangan diubah tanpa alasan kuat!):
          #  Run #9 = SATU-SATUNYA run yang sync-nya BERHASIL.
          #  Perintahnya PERSIS:
          #    repo sync -c -j$(nproc --all) --force-sync \
          #      --no-clone-bundle --no-tags --optimized-fetch
          #
          #  Run #10-#13 SEMUA gagal di proyek pertama ber-clone-depth=1
          #  ("Cannot initialize work tree for platform/external/chromium-webview").
          #  Perbedaan run #11+ vs run #9 pada step ini:
          #    + 'git config http.*' tweak
          #    + 'timeout' + 'stdbuf -oL -eL' wrapper
          #    + '--verbose' + '2>&1'
          #  Salah satu dari itu mengubah jalur fetch repo sehingga
          #  partial-clone + shallow (98 proyek ber-clone-depth=1)
          #  gagal checkout.
          #
          #  => Kembalikan ke perintah run #9 yang TERBUKTI.
          #     Retry tetap ada, tapi tanpa wrapper/timeout/verbose.
          # ============================================================
          echo "=== MULAI SYNC: $(date -u) ==="
          ok=0
          for attempt in 1 2 3; do
            echo ">>> SYNC percobaan $attempt/3  ($(date -u))"
            if repo sync -c -j$(nproc --all) --force-sync \
                 --no-clone-bundle --no-tags --optimized-fetch; then
              echo ">>> SYNC OK pada percobaan $attempt"
              ok=1
              break
            fi
            echo ">>> SYNC percobaan $attempt GAGAL pada $(date -u)"
            df -h / || true
            # PEMULIHAN: error 'Cannot initialize work tree' muncul pada proyek
            # ber-clone-depth=1 akibat partial-clone+shallow. Buang SEMUA jejak
            # proyek itu, lalu tandai supaya percobaan berikutnya clone ulang
            # TANPA state parsial (fresh).
            for proj in external/chromium-webview external/chromiumos-config; do
              if [ -e "$proj" ] || [ -e ".repo/projects/$proj.git" ]; then
                echo ">>> bersihkan jejak parsial: $proj"
                rm -rf "$proj" ".repo/projects/$proj.git" \
                       ".repo/project-objects/$(echo $proj | tr '/' '_').git" 2>/dev/null || true
              fi
            done
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "=== SYNC GAGAL setelah 3 percobaan: $(date -u) ==="
            exit 1
          fi
          echo "=== SYNC SELESAI: $(date -u) ==="

      - name: Reclaim space (hapus .git & .repo)
        run: |
          cd ~/android/pixelos
          echo "=== Disk sebelum reclaim ==="; df -h /
          # Build tidak butuh metadata git/.repo. Buang untuk hemat puluhan GB.
          find . -type d -name .git -prune -exec rm -rf {} + 2>/dev/null || true
          rm -rf .repo 2>/dev/null || true
          echo "=== Disk setelah reclaim ==="; df -h /
          echo "=== Ukuran source ==="; du -sh . 2>/dev/null || true

      - name: Install Go toolchain (arm64 host)
        run: |
          cd ~/android/pixelos
          # ============================================================
          # MASALAH (run #14 & #15):
          #  #14: 'prebuilts/go/linux-arm64/: No such file or directory' (exit 127)
          #  #15: Go jalan, tapi microfactory GAGAL compile:
          #       "Failed to compile github.com/google/blueprint/...: exit status 2"
          #
          # Penyebab (dikonfirmasi dari referensi AOSP-on-ARM64):
          #  - manifest PixelOS hanya punya prebuilts/go/linux-x86.
          #  - Soong: GOROOT = prebuilts/go/<GOOS>-<GOARCH> -> 'linux-arm64'.
          #  - Tarball Go upstream TIDAK berisi arsip std-lib terkompilasi
          #    di $GOROOT/pkg/linux_arm64/*.a, padahal bootstrap microfactory
          #    AOSP MEMBUTUHKAN arsip itu. Prebuilt AOSP punya; tarball tidak.
          #
          # Solusi: sediakan toolchain resmi go1.23.4 (versi SAMA dgn prebuilt
          # AOSP: prebuilts/go/linux-x86/VERSION = go1.23.4), lalu BANGUN
          # arsip std lib ke $GOROOT/pkg/linux_arm64 lewat 'go install std'.
          # ============================================================
          GOROOT_DIR="prebuilts/go/linux-arm64"
          mkdir -p prebuilts/go
          if [ ! -x "$GOROOT_DIR/bin/go" ]; then
            GOVER="go1.23.4"
            echo ">>> unduh ${GOVER}.linux-arm64.tar.gz"
            curl -fL --retry 3 --connect-timeout 30 \
              "https://go.dev/dl/${GOVER}.linux-arm64.tar.gz" -o /tmp/go.tar.gz
            rm -rf /tmp/goextract && mkdir -p /tmp/goextract
            tar -C /tmp/goextract -xzf /tmp/go.tar.gz
            rm -rf "$GOROOT_DIR"
            mv /tmp/goextract/go "$GOROOT_DIR"
            rm -f /tmp/go.tar.gz
          fi
          export GOROOT="$(cd "$GOROOT_DIR" && pwd)"
          export PATH="$GOROOT/bin:$PATH"
          unset GOPATH GOFLAGS
          echo ">>> go version:"; go version
          echo ">>> GOROOT=$GOROOT"

          # ---- Populasi $GOROOT/pkg/<goos>_<goarch>/*.a ----
          # KUNCI (dikonfirmasi dari source cmd/go Go 1.23.4, build.go):
          #   "Setting GODEBUG=installgoroot=all restores the use of
          #    $GOROOT/pkg/$GOOS_$GOARCH"
          # Go >= 1.20 berhenti menulis pkg/*.a secara default, TAPI
          # microfactory AOSP membutuhkannya. GODEBUG ini mengembalikan
          # perilaku lama -> arsip .a ditulis ke $GOROOT/pkg/linux_arm64/.
          echo ">>> [1/3] go install -a std (GODEBUG=installgoroot=all)"
          ( cd "$GOROOT/src" && GO111MODULE=off GOPATH="$GOROOT" \
              GODEBUG=installgoroot=all \
              go install -a std 2>&1 | tail -15 ) || true
          CNT=$(find "$GOROOT/pkg" -name '*.a' 2>/dev/null | wc -l)
          echo ">>> jumlah .a setelah cara 1: $CNT"

          if [ "$CNT" -lt 50 ]; then
            echo ">>> [2/3] ulangi tanpa -a (arsip sebagian sudah ada)"
            ( cd "$GOROOT/src" && GO111MODULE=off GOPATH="$GOROOT" \
                GODEBUG=installgoroot=all \
                go install std 2>&1 | tail -15 ) || true
            CNT=$(find "$GOROOT/pkg" -name '*.a' 2>/dev/null | wc -l)
            echo ">>> jumlah .a setelah cara 2: $CNT"
          fi

          # ---- DIAGNOSTIK: reproduksi bootstrap microfactory dgn output PENUH ----
          # Ini yang gagal di run #15 ('Failed to compile ... exit status 2').
          # Kita jalankan manual supaya pesan error asli terlihat.
          echo ">>> DIAGNOSTIK: uji bootstrap microfactory (output penuh)"
          DIAG=/tmp/mf_diag
          rm -rf "$DIAG" && mkdir -p "$DIAG"
          BLUEPRINT_DIR="$PWD/build/blueprint"
          if [ -f "$BLUEPRINT_DIR/microfactory/microfactory.go" ]; then
            sed 's/^package microfactory/package main/' \
              "$BLUEPRINT_DIR/microfactory/microfactory.go" > "$DIAG/microfactory.go"
            printf '\n//for use with go run\nfunc main() { Main() }\n' >> "$DIAG/microfactory.go"
            echo "--- go run microfactory.go (stderr+stdout penuh) ---"
            ( cd "$DIAG" && GOPATH="$GOROOT" GO111MODULE=off GOFLAGS= \
                go run microfactory.go 2>&1 | head -60 ) || true
            echo "--- go env (ringkas) ---"
            go env GOROOT GOOS GOARCH GOPATH GOCACHE GOFLAGS CGO_ENABLED GOPROXY
            echo "--- isi pkg/ ---"
            find "$GOROOT/pkg" -maxdepth 1 2>/dev/null || true
          else
            echo ">>> blueprint belum ada di $BLUEPRINT_DIR (lewati diagnostik)"
          fi

          echo ">>> selesai setup Go"

      - name: Survey ARM64 host prebuilts (diagnostik)
        run: |
          cd ~/android/pixelos
          # Laporan cepat: prebuilt host ARM64 mana yang ada / tidak ada.
          # Ini memberi tahu masalah lanjutan TANPA menunggu build panjang.
          echo "=== SURVEY prebuilt host (arm64 vs x86) ==="
          for p in \
            prebuilts/go/linux-arm64 prebuilts/go/linux-x86 \
            prebuilts/clang/host/linux-arm64 prebuilts/clang/host/linux-x86 \
            prebuilts/build-tools/linux-arm64 prebuilts/build-tools/linux-x86 \
            prebuilts/rust/linux-arm64 prebuilts/rust/linux-x86 \
            prebuilts/jdk/jdk21/linux-arm64 prebuilts/jdk/jdk21/linux-x86 \
            prebuilts/sdk prebuilts/misc/linux-arm64 prebuilts/misc/linux-x86 ; do
            if [ -e "$p" ]; then
              echo "  ADA     : $p"
            else
              echo "  TIDAK   : $p"
            fi
          done
          echo ""
          echo "=== nproc / uname (konteks host) ==="
          uname -m; nproc
          echo ""
          echo "=== isi prebuilts/build-tools (top-level) ==="
          ls prebuilts/build-tools 2>/dev/null || true
          echo ""
          echo "=== isi prebuilts/clang/host ==="
          ls prebuilts/clang/host 2>/dev/null || true
          echo ""
          echo "=== isi prebuilts/rust ==="
          ls prebuilts/rust 2>/dev/null || true
          echo ""
          echo "=== isi prebuilts/rust/linux-arm64 (jika ada) ==="
          ls prebuilts/rust/linux-arm64 2>/dev/null || true
          echo ""
          echo "=== isi prebuilts/jdk ==="
          ls prebuilts/jdk 2>/dev/null || true

      - name: Drop ARM64 host prebuilts (clang)
        run: |
          cd ~/android/pixelos
          # ============================================================
          # MASALAH: manifest PixelOS tak punya Clang host arm64
          #   (prebuilts/clang/host/linux-arm64 kosong di branch main).
          #   Branch 'mirror-goog-main-prebuilts' PUNYA arm64 Clang
          #   (clang-r584948b / r596125 / r614150) тт- terverifikasi.
          #
          # Versi yang DIMINTA tree (dikonfirmasi dari soong global.go):
          #   ClangDefaultVersion      = "clang-r547379"
          #   ClangDefaultShortVersion = "20"
          # Arm64 prebuilt tak punya r547379 -> pakai r584948b (LLVM 22),
          # dengan symlink nama + override env (lihat tahap Build).
          #
          # Referensi: blog actinis.io "Building AOSP on ARM64".
          #
          # Cara: git clone --depth=1 --sparse (ambil dir clang saja).
          # ============================================================
          CLANG_DIR="prebuilts/clang/host/linux-arm64"
          if [ -x "$CLANG_DIR/clang-r584948b/bin/clang" ]; then
            echo ">>> clang arm64 sudah ada, lewati"
            "$CLANG_DIR/clang-r584948b/bin/clang" --version | head -1 || true
            exit 0
          fi
          mkdir -p "$CLANG_DIR"
          echo ">>> clone branch mirror-goog-main-prebuilts (sparse)"
          rm -rf /tmp/clangarm
          # Branch ini punya arm64 Clang terbanyak (clang-r584948b, -r596125, -r614150).
          git clone --depth=1 --filter=blob:none --sparse \
            -b mirror-goog-main-prebuilts \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-arm64 \
            /tmp/clangarm 2>&1 | tail -3
          ( cd /tmp/clangarm && git sparse-checkout set clang-r584948b 2>&1 | tail -2 )
          echo ">>> pindahkan clang-r584948b"
          rm -rf "$CLANG_DIR/clang-r584948b"
          mv /tmp/clangarm/clang-r584948b "$CLANG_DIR/clang-r584948b"
          rm -rf /tmp/clangarm
          # PENTING: tree PixelOS sixteen mencari nama versi SPESIFIK.
          # Dikonfirmasi dari cc/config/global.go (soong):
          #   ClangDefaultVersion = "clang-r547379"
          # Arm64 prebuilt yang tersedia: r584948b / r596125 / r614150.
          # Karena tak ada r547379 untuk arm64, kita symlink nama yang dicari
          # ke versi arm64 terdekat (pendekatan yang sama dipakai blog actinis).
          for V in clang-r547379 clang-r584948; do
            ln -sfn clang-r584948b "$CLANG_DIR/$V"
          done
          echo ">>> hasil:"
          ls -la "$CLANG_DIR" || true
          du -sh "$CLANG_DIR" 2>/dev/null || true
          "$CLANG_DIR/clang-r584948b/bin/clang" --version | head -2 || true
          echo ">>> versi Clang yang dicari tree (konfirmasi runtime):"
          grep -rhoE '"clang-r[0-9a-z]+"' build/soong/cc/config/global.go 2>/dev/null | sort -u | head -5 || true
          echo ">>> SHORT VERSION yang dicari tree:"
          grep -rhoE 'ClangDefaultShortVersion\s*=\s*"[0-9]+"' build/soong/cc/config/global.go 2>/dev/null | head -3 || true
          # PENTING: tree minta short version "20" (LLVM 20), tapi clang-r584948b
          # adalah LLVM 22 -> path RTLIB 'lib/clang/20/lib/linux' tak ada.
          # Buat symlink lib/clang/20 -> 22 sebagai jaring pengaman
          # (selain override LLVM_RELEASE_VERSION=22 di tahap build).
          if [ -d "$CLANG_DIR/clang-r584948b/lib/clang/22" ]; then
            ln -sfn 22 "$CLANG_DIR/clang-r584948b/lib/clang/20"
            echo ">>> dibuat symlink lib/clang/20 -> 22"
          fi
          ls "$CLANG_DIR/clang-r584948b/lib/clang/" || true

      - name: Drop ARM64 Rust toolchain (host)
        run: |
          cd ~/android/pixelos
          # ============================================================
          # MASALAH: prebuilts/rust hanya punya linux-x86, linux-musl-x86,
          #   darwin-x86, windows-x86. Host arm64 tidak ada.
          #   config.HostPrebuiltTag() = config.PrebuiltOS() = "linux-arm64"
          #   (build/soong/rust/config/global.go:143-149), dan RustPath =
          #   prebuilts/rust/<tag>/<versi> (global.go:99-107).
          #   Versi wajib 1.83.0 (global.go:28 RustDefaultVersion).
          #
          # Layout yang dibutuhkan soong (diverifikasi dari sumber):
          #   prebuilts/rust/soong/rustprebuilts.go:
          #     getRustLibDir() = "<versi>/lib/rustlib"
          #     addPrebuiltToTarget(dir = platform/rustDir/arch/lib)
          #       => linux-arm64/1.83.0/lib/rustlib/aarch64-unknown-linux-gnu/lib
          #     getPrebuilt() ERROR kalau jumlah libstd-*.rlib / *.so != 1.
          #   prebuilts/rust/Android.bp:539-545:
          #     toolchain_prebuilt_src: "bin/rustc"
          #     toolchain_deps: ["lib/*", "lib64/*"]
          #       => direktori lib64/ WAJIB ada dan TIDAK boleh kosong
          #          (glob kosong = error soong).
          #   prebuilts/rust/Android.bp:74:
          #     stdlibs_src_path = "lib/rustlib/src/rust/"
          #       => butuh komponen rust-src (dipakai utk build stdlib device).
          #
          # Sumber: dist resmi rust-lang utk host aarch64-unknown-linux-gnu.
          # ============================================================
          RV="1.83.0"
          TRIPLE="aarch64-unknown-linux-gnu"
          D="prebuilts/rust/linux-arm64/$RV"
          LIBDIR="$D/lib/rustlib/$TRIPLE/lib"

          if [ -x "$D/bin/rustc" ] && [ -d "$D/lib/rustlib/src/rust/library" ] && ls "$LIBDIR"/libstd-*.rlib >/dev/null 2>&1; then
            echo ">>> rust host arm64 sudah lengkap, lewati unduhan"
          else
            echo ">>> unduh dist resmi rust $RV ($TRIPLE)"
            rm -rf /tmp/rustdrop /tmp/ruststage
            mkdir -p /tmp/rustdrop /tmp/ruststage
            curl -fL --retry 3 -o /tmp/rustdrop/rust.tar.gz \
              "https://static.rust-lang.org/dist/rust-${RV}-${TRIPLE}.tar.gz"
            tar xzf /tmp/rustdrop/rust.tar.gz -C /tmp/rustdrop
            SRC="/tmp/rustdrop/rust-${RV}-${TRIPLE}"
            echo ">>> komponen tersedia:"; ls "$SRC"
            # Dist gabungan rust hanya punya install.sh di ROOT (bukan per komponen).
            # Pakai --components dari root installer (cara resmi rust-lang).
            COMPONENTS="rustc,cargo,rust-std-${TRIPLE},clippy-preview,rustfmt-preview"
            if [ -f "$SRC/install.sh" ]; then
              echo ">>> install via root install.sh --components=$COMPONENTS"
              ( cd "$SRC" && sh ./install.sh --prefix=/tmp/ruststage --disable-ldconfig --components="$COMPONENTS" )
            else
              echo "    !! install.sh tidak ada di root dist, fallback salin mentah"
              ( cd "$SRC" && cp -a ./* /tmp/ruststage/ )
            fi
            mkdir -p "$D"
            cp -a /tmp/ruststage/. "$D/"
            rm -rf /tmp/rustdrop /tmp/ruststage
          fi

          # lib64/* dipakai toolchain_deps rustc; dist resmi tidak punya
          # libc++.so/libunwind.so (itu artefak build Android), jadi cukup
          # librustc_driver (arch arm64, bukan x86) sbg symlink.
          mkdir -p "$D/lib64"
          if ! ls "$D/lib64"/* >/dev/null 2>&1; then
            ( cd "$D/lib64" && ln -sf ../lib/librustc_driver-*.so . ) || true
            # buang symlink dangling bila glob tidak match
            for l in "$D/lib64"/*; do [ -e "$l" ] || rm -f "$l"; done
          fi
          ls -la "$D/lib64" || true

          echo ">>> layout:"; find "$D" -maxdepth 4 -type d | head -20
          "$D/bin/rustc" --version || { echo "!! bin/rustc tidak bisa jalan"; exit 1; }
          echo ">>> sysroot: $("$D/bin/rustc" --print sysroot)"
          ls "$D/lib/rustlib/src/rust/library" >/dev/null 2>&1 \
            && echo "    OK  : rust-src ada (lib/rustlib/src/rust/library)" \
            || echo "    WARN: rust-src TIDAK ada (opsional, lanjutkan)"
          ls "$D/lib64"/* >/dev/null 2>&1 \
            && echo "    OK  : lib64/ tidak kosong" \
            || { echo "    !! lib64/ kosong"; exit 1; }

          n_rlib=$(ls "$LIBDIR"/libstd-*.rlib 2>/dev/null | wc -l)
          n_so=$(ls "$LIBDIR"/libstd-*.so 2>/dev/null | wc -l)
          echo ">>> libstd di $LIBDIR: rlib=$n_rlib so=$n_so"
          if [ "$n_rlib" != "1" ] || [ "$n_so" != "1" ]; then
            echo "!! getPrebuilt() butuh TEPAT 1 libstd-*.rlib dan 1 libstd-*.so"
            ls -la "$LIBDIR" | head -20 || true
            exit 1
          fi
          echo ">>> OK: rust host arm64 siap"

      - name: Apply ARM64 host patches (build system)
        run: |
          cd ~/android/pixelos
          # Terapkan patch set arm64-host (subset padanan blog actinis yang
          # terbukti berlaku di PixelOS sixteen; lihat README patch).
          # Skrip idempoten; lihat scripts/apply-arm64-host.sh di device tree.
          bash "$GITHUB_WORKSPACE/device-tree/scripts/apply-arm64-host.sh" "$PWD" || true
          echo ""
          echo ">>> Konfirmasi hasil patch langsung dari tree:"
          grep -n "HOST_ARCH := arm64" build/make/core/envsetup.mk || echo "    !! HOST_ARCH arm64 TIDAK ada"
          grep -n "HOST_PREBUILT_ARCH := arm64" build/make/core/envsetup.mk || echo "    !! HOST_PREBUILT_ARCH arm64 TIDAK ada"
          grep -n "endif penutup blok HOST_ARCH" build/make/core/envsetup.mk || echo "    !! endif penutup HOST_ARCH TIDAK ada"
          # PATCH 0003 sengaja di-SKIP: prefix crate source "linux-x86" itu
          # arch-independent (hanya sumber crate, bukan binary host), dan
          # mengubahnya justru berisiko. Yang dipatch adalah config toolchain
          # (0016, rust/config/arm_linux_host.go) + prebuilt std (0017).
          grep -q 'filepath.Join("linux-x86", GetRustPrebuiltVersion' build/soong/rust/toolchain_library.go \
            && echo "    OK  : hardcode crate linux-x86 dipertahankan (PATCH 0003 di-skip)" \
            || echo "    CATATAN: hardcode linux-x86 tidak ada (PATCH 0003 terpasang?)"
          grep -n "arm64-host: toolchain rust host glibc untuk aarch64" build/soong/rust/config/arm_linux_host.go || echo "    !! PATCH 0016 tidak terpasang"
          grep -n "linuxGlibcArm64ToolchainFactory" build/soong/rust/config/arm_linux_host.go || echo "    !! factory glibc arm64 tidak ada"
          grep -n "arm64-host: prebuilt std Rust untuk host aarch64" prebuilts/rust/soong/rustprebuilts.go || echo "    !! PATCH 0017 tidak terpasang"
          grep -n "Linux_glibc_arm64" prebuilts/rust/soong/rustprebuilts.go | head -3
          for f in build/make/core/clang/HOST_arm64.mk; do
            [ -f "$f" ] && echo "    ADA : $f" || echo "    !! TIDAK: $f"
          done
          grep -q "linux_musl_arm64" prebuilts/jdk/jdk21/Android.bp && echo "    OK  : jdk21 javap arm64" || echo "    !! jdk21 javap arm64 TIDAK ada"
          grep -q "Xmx8g" build/soong/scripts/jar-wrapper.sh && echo "    OK  : jar-wrapper -Xmx8g" || echo "    !! jar-wrapper TIDAK dipatch"

      - name: Clone device + vendor tree
        run: |
          cd ~/android/pixelos
          rm -rf device/infinix/X6840 vendor/infinix/X6840
          mkdir -p device/infinix vendor/infinix
          cp -r "$GITHUB_WORKSPACE/device-tree/device/infinix/X6840" device/infinix/X6840
          cp -r "$GITHUB_WORKSPACE/device-tree/vendor/infinix/X6840" vendor/infinix/X6840

      - name: Check text encoding (BOM/CRLF)
        run: |
          cd ~/android/pixelos
          python3 "$GITHUB_WORKSPACE/device-tree/scripts/check-text-encoding.py" \
            device/infinix/X6840 vendor/infinix/X6840

      - name: Fetch vendor blobs (GitHub Release)
        run: |
          cd ~/android/pixelos
          bash "$GITHUB_WORKSPACE/device-tree/scripts/fetch-blobs.sh" \
            vendor/infinix/X6840/proprietary

      - name: Verify blobs
        run: |
          cd ~/android/pixelos
          echo "Jumlah file blob:"; find vendor/infinix/X6840/proprietary -type f | wc -l
          du -sh vendor/infinix/X6840/proprietary

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: pixelos-X6840-${{ github.ref }}
          # Disk runner terbatas; out/ AOSP sendiri bisa 30-40 GB.
          max-size: 2G

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fix source tree (patch broken PixelOS sixteen files)
        run: |
          cd ~/android/pixelos
          echo ">>> Fixing prebuilts/build-tools/Android.bp syntax error..."
          # Error: expected "}", found Ident at line ~100
          if [ -f prebuilts/build-tools/Android.bp ]; then
            # Fix missing closing brace before flex module
                        # Use sed to insert missing } before flex module
            sed -i '/^prebuilt_build_tool {/,/^    }$/ { /name: "flex"/i    }
}' prebuilts/build-tools/Android.bp 2>/dev/null || true
            # Fallback python fix if sed did not work
            python3 -c "
import sys
with open('prebuilts/build-tools/Android.bp') as f: t=f.read()
if 'name: "flex"' in t and '    }
    prebuilt_build_tool {
        name: "flex"' not in t:
    t=t.replace('    }
    prebuilt_build_tool {
        name: "flex"', '    }
    }
    prebuilt_build_tool {
        name: "flex"')
    open('prebuilts/build-tools/Android.bp','w').write(t)
    print('Fixed')
"
          fi
          echo ">>> Fixing broken hardware/qcom symlinks..."
          for dir in hardware/qcom/sdm845 hardware/qcom/sm8150 hardware/qcom/sm7250; do
            bp="\$dir/Android.bp"
            if [ -L "\$bp" ]; then
              target=$(readlink "\$bp")
              if [ ! -e "\$dir/\$target" ]; then
                echo "  Removing broken symlink: \$bp -> \$target"
                rm -f "\$bp"
                echo "// Stub to satisfy soong (original symlink was broken)" > "\$bp"
              fi
            fi
          done
          echo ">>> Source tree fixes applied."

      - name: Build
        run: |
          cd ~/android/pixelos
          echo "=== Disk sebelum build ==="; df -h /
          # ARM64-host: pakai Clang arm64 yg tersedia (r584948b, LLVM 22) walau
          # tree default minta r547379 / LLVM 20. Keduanya punya override env.
          export LLVM_PREBUILTS_VERSION=clang-r584948b
          export LLVM_RELEASE_VERSION=22
          echo ">>> Clang override: version=$LLVM_PREBUILTS_VERSION short=$LLVM_RELEASE_VERSION"
          source build/envsetup.sh
          export CCACHE_EXEC=$(which ccache)
          export USE_CCACHE=1
          export CCACHE_DIR=/home/runner/.ccache
          ccache -M 2G
          # Android 16 butuh RAM besar; batasi job agar runner tidak OOM
          JOBS=$(( $(nproc --all) / 2 ))
          echo "Memakai -j$JOBS  (nproc=$(nproc --all))"
          # PENTING: nama product kita 'pixelos_X6840' mengandung underscore.
          # Format legacy 'product-variant' akan di-parse dgn delimiter '-'
          # sehingga variant jadi kosong -> "Invalid lunch combo".
          # Gunakan format baru: lunch <product> <release> <variant>
          # PENTING soal RELEASE config:
          #   PixelOS HANYA punya satu release config: 'bp2a'
          #   (lihat vendor/aosp/release/release_config_map.mk).
          #   Default AOSP 'trunk_staging' TIDAK ADA di PixelOS ->
          #   run #16 gagal: "panic: Missing config trunk_staging".
          #   'bp2a' juga cocok dgn build vendor device kita
          #   (Infinix-X6840:16/BP2A.250605.031.A3).
          echo "=== LUNCH: $(date -u) ==="
          lunch pixelos_X6840 bp2a ${{ github.event.inputs.build_type || 'userdebug' }}
          echo "=== LUNCH SELESAI, cek product ==="
          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"
          echo "TARGET_DEVICE=$TARGET_DEVICE"
          [ -n "$TARGET_PRODUCT" ] || { echo ">>> TARGET_PRODUCT kosong: lunch gagal"; exit 1; }
          # Heartbeat: cetak baris tiap 5 menit supaya log tetap terlihat hidup,
          # dan progres ninja terlihat (unbuffered).
          ( while true; do sleep 300; echo "[heartbeat] $(date -u) build masih jalan"; done ) &
          HB=$!
          echo "=== MULAI mka bacon: $(date -u) ==="
          # mka adalah shell function (dari envsetup.sh), stdbuf tidak bisa jalanin function.
          if ! mka bacon -j$JOBS 2>&1 | tee build.log; then
            echo "=== BUILD GAGAL ==="
            tail -300 build.log
            kill $HB 2>/dev/null || true
            exit 1
          fi
          kill $HB 2>/dev/null || true
          echo "=== BUILD SELESAI: $(date -u) ==="
          echo "=== Disk setelah build ==="; df -h /

      - name: Upload ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PixelOS-X6840-${{ github.run_number }}
          path: |
            /home/runner/android/pixelos/out/target/product/X6840/*.zip
            /home/runner/android/pixelos/out/target/product/X6840/*.img
            /home/runner/android/pixelos/out/target/product/X6840/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: /home/runner/android/pixelos/build.log
          if-no-files-found: ignore
          retention-days: 7


