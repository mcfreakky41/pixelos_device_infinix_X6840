name: Build PixelOS for Infinix Smart 20 (X6840)

on:
  workflow_dispatch:
    inputs:
      pixelos_branch:
        description: "PixelOS branch"
        required: true
        default: "fifteen"
      build_type:
        description: "Build type"
        required: true
        default: "userdebug"
        type: choice
        options: [userdebug, user, eng]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ROM
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Set up build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 openjdk-17-jdk

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          swap-storage: true

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config --global user.name "PixelOS Builder"
          git config --global user.email "builder@localhost"
          git config --global credential.helper 'store --file=/tmp/git-creds'
          echo "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com" > /tmp/git-creds

      - name: Initialize PixelOS source
        run: |
          mkdir -p ~/android/pixelos
          cd ~/android/pixelos
          git config --global color.ui false
          repo init --depth=1 --no-repo-verify \
            -u https://github.com/PixelOS-AOSP/manifest.git \
            -b "${{ github.event.inputs.pixelos_branch || 'fifteen' }}"

      - name: Sync sources
        run: |
          cd ~/android/pixelos
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone device + vendor tree
        run: |
          cd ~/android/pixelos
          rm -rf device/infinix/X6840 vendor/infinix/X6840
          mkdir -p device/infinix vendor/infinix
          cp -r "$GITHUB_WORKSPACE/device-tree/device/infinix/X6840" device/infinix/X6840
          cp -r "$GITHUB_WORKSPACE/device-tree/vendor/infinix/X6840" vendor/infinix/X6840

      - name: Fetch vendor blobs (GitHub Release)
        run: |
          cd ~/android/pixelos
          bash "$GITHUB_WORKSPACE/device-tree/scripts/fetch-blobs.sh" \
            vendor/infinix/X6840/proprietary

      - name: Verify blobs
        run: |
          cd ~/android/pixelos
          echo "Jumlah file blob:"; find vendor/infinix/X6840/proprietary -type f | wc -l
          du -sh vendor/infinix/X6840/proprietary

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: pixelos-X6840-${{ github.ref }}
          max-size: 30G

      - name: Build
        run: |
          cd ~/android/pixelos
          source build/envsetup.sh
          export CCACHE_EXEC=$(which ccache)
          export USE_CCACHE=1
          export CCACHE_DIR=/home/runner/.ccache
          ccache -M 30G
          lunch pixelos_X6840-${{ github.event.inputs.build_type || 'userdebug' }}
          mka bacon -j$(nproc --all) 2>&1 | tee build.log || {
            echo "=== BUILD GAGAL ==="
            tail -200 build.log
            exit 1
          }

      - name: Upload ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PixelOS-X6840-${{ github.run_number }}
          path: |
            /home/runner/android/pixelos/out/target/product/X6840/*.zip
            /home/runner/android/pixelos/out/target/product/X6840/*.img
            /home/runner/android/pixelos/out/target/product/X6840/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: /home/runner/android/pixelos/build.log
          if-no-files-found: ignore
          retention-days: 7
